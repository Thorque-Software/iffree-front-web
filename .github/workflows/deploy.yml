# .github/workflows/deploy.yml
name: Deploy Next.js to Server

on:
  push:
    branches: [ main, dev, ci ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '24.x'
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Create deployment package
      run: |
        mkdir -p deployment
        cp -r .next public package.json package-lock.json next.config.ts deployment/
        tar -czf deployment.tar.gz deployment/

    - name: Setup SSH private key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        ssh-agent -a $SSH_AUTH_SOCK > /dev/null
        echo "$SSH_PRIVATE_KEY" | ssh-add - >/dev/null

    - name: Clean directory
      run: |
        ssh -o StrictHostKeyChecking=no $SERVER_HOST \
        "rm -r $DEPLOY_PATH/* && \
         echo '$ENV_FILE_CONTENT' > $DEPLOY_PATH/.env"

    - name: Copy files
      run: |
        scp -o StrictHostKeyChecking=no deployment.tar.gz $SERVER_HOST:$DEPLOY_PATH

    - name: Deploy 
      run: |
        ssh -o StrictHostKeyChecking=no $SERVER_HOST \
        "
         cd $DEPLOY_PATH && pwd && \
         tar -xzf deployment.tar.gz --strip-components=1 && \
         rm -rf deployment.tar.gz \
        "

    env:
      ENV_FILE_CONTENT: |
        NEXT_PUBLIC_API_URL=http://18.189.243.17:80
      SERVER_HOST: ubuntu@18.189.243.17
      DEPLOY_PATH: /home/ubuntu/iffree-front
